name: Close superseded Dependabot PRs

on:
  push:
    branches:
      - copilot/consolidate-dependabot-prs

permissions:
  pull-requests: write
  issues: write

jobs:
  close-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Close superseded Dependabot PRs with duplicate comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: FalkorDB/QueryWeaver
        run: |
          COMMENT="This PR is superseded by #473 which consolidates all open Dependabot dependency updates into a single PR targeting staging. Closing as duplicate."
          for PR in 456 457 458 459 460 462 463 465 468 470; do
            echo "Commenting on and closing PR #${PR}..."
            gh pr comment "${PR}" --repo "${REPO}" --body "${COMMENT}" || true
            gh pr close "${PR}" --repo "${REPO}" --comment "Superseded by #473 (consolidates all open Dependabot PRs)" || true
          done
          echo "Done closing all superseded Dependabot PRs."
