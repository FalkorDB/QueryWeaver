name: Spellcheck
permissions:
  contents: read
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Spellcheck
        uses: rojopolis/spellcheck-github-actions@f2df388397bcb35f524b4a0a3567d6b1e8a4e595 # 0.68.0
        with:
          config_path: .github/spellcheck-settings.yml
          task_name: Markdown